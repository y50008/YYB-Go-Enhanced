name: Sync Upstream Releases

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: 525815266/YYB-Go-Enhanced
          FORK: y50008/YYB-Go-Enhanced
        run: |
          set -e
          echo "Fetching upstream releases from $UPSTREAM..."

          RELEASES_JSON=$(curl -s "https://api.github.com/repos/$UPSTREAM/releases?per_page=100")
          RELEASE_COUNT=$(echo "$RELEASES_JSON" | jq 'length')
          echo "Found $RELEASE_COUNT upstream releases"

          for i in $(seq 0 $((RELEASE_COUNT - 1))); do
            RID=$(echo "$RELEASES_JSON" | jq -r ".[$i].id")
            TAG=$(echo "$RELEASES_JSON" | jq -r ".[$i].tag_name")
            NAME=$(echo "$RELEASES_JSON" | jq -r ".[$i].name // \"\"")
            BODY=$(echo "$RELEASES_JSON" | jq -r ".[$i].body // \"\"")
            PRERELEASE=$(echo "$RELEASES_JSON" | jq -r ".[$i].prerelease")
            DRAFT=$(echo "$RELEASES_JSON" | jq -r ".[$i].draft")

            if [ "$DRAFT" = "true" ]; then
              echo "Skipping draft $TAG"
              continue
            fi

            EXISTING=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$FORK/releases/tags/$TAG")
            EXISTING_ID=$(echo "$EXISTING" | jq -r '.id // empty')

            if [ -n "$EXISTING_ID" ]; then
              echo "Release $TAG exists (id=$EXISTING_ID), syncing missing assets..."
              NEW_ID="$EXISTING_ID"
            else
              echo "Creating release $TAG in fork..."
              CREATE_BODY=$(jq -n \
                --arg tag "$TAG" \
                --arg name "$NAME" \
                --arg body "$BODY" \
                --argjson prerelease "$PRERELEASE" \
                '{tag_name: $tag, name: $name, body: $body, prerelease: $prerelease, generate_release_notes: false}')
              NEW_RELEASE=$(curl -s -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/json" \
                -d "$CREATE_BODY" \
                "https://api.github.com/repos/$FORK/releases")
              NEW_ID=$(echo "$NEW_RELEASE" | jq -r '.id // empty')
              if [ -z "$NEW_ID" ]; then
                echo "Failed to create release $TAG: $NEW_RELEASE"
                continue
              fi
              echo "Created release $TAG (id=$NEW_ID)"
            fi

            ASSETS_JSON=$(curl -s "https://api.github.com/repos/$UPSTREAM/releases/$RID/assets")
            ASSET_COUNT=$(echo "$ASSETS_JSON" | jq 'length')
            echo "  Syncing $ASSET_COUNT assets for $TAG..."

            FORK_ASSETS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$FORK/releases/$NEW_ID/assets")
            FORK_ASSET_NAMES=$(echo "$FORK_ASSETS" | jq -r '.[].name')

            for j in $(seq 0 $((ASSET_COUNT - 1))); do
              ANAME=$(echo "$ASSETS_JSON" | jq -r ".[$j].name")
              URL=$(echo "$ASSETS_JSON" | jq -r ".[$j].url")

              if echo "$FORK_ASSET_NAMES" | grep -q "^$ANAME$"; then
                echo "    $ANAME already exists, skipping"
                continue
              fi

              echo "    Downloading $ANAME..."
              curl -sL -H "Accept: application/octet-stream" "$URL" -o "/tmp/$ANAME"

              echo "    Uploading $ANAME..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@/tmp/$ANAME" \
                "https://uploads.github.com/repos/$FORK/releases/$NEW_ID/assets?name=$ANAME")

              if [ "$HTTP_CODE" = "201" ]; then
                echo "    Uploaded $ANAME"
              else
                echo "    Failed to upload $ANAME (HTTP $HTTP_CODE)"
              fi
              rm -f "/tmp/$ANAME"
            done
            echo "  Release $TAG done."
          done
          echo "All done."
