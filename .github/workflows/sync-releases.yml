name: Sync Upstream Releases

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Sync releases with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: 525815266/YYB-Go-Enhanced
          FORK: y50008/YYB-Go-Enhanced
        run: |
          set -e
          echo "Fetching upstream releases from $UPSTREAM..."

          # Anonymous curl for upstream (GITHUB_TOKEN can't access other repos)
          RELEASES_JSON=$(curl -s "https://api.github.com/repos/$UPSTREAM/releases?per_page=100")
          RELEASE_IDS=$(echo "$RELEASES_JSON" | jq -r '.[] | select(.draft == false) | .id')

          for RID in $RELEASE_IDS; do
            TAG=$(echo "$RELEASES_JSON" | jq -r ".[] | select(.id == $RID) | .tag_name")
            NAME=$(echo "$RELEASES_JSON" | jq -r ".[] | select(.id == $RID) | .name // \"\"")
            BODY=$(echo "$RELEASES_JSON" | jq -r ".[] | select(.id == $RID) | .body // \"\"")
            PRERELEASE=$(echo "$RELEASES_JSON" | jq -r ".[] | select(.id == $RID) | .prerelease")

            EXISTS=$(gh api "repos/$FORK/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" || true)
            if [ -n "$EXISTS" ]; then
              echo "Release $TAG already exists in fork, skipping."
              continue
            fi

            echo "Creating release $TAG in fork..."
            NEW_RELEASE=$(gh api "repos/$FORK/releases" \
              -f tag_name="$TAG" \
              -f name="$NAME" \
              -f body="$BODY" \
              -F prerelease="$PRERELEASE" \
              -F generate_release_notes=false)
            NEW_ID=$(echo "$NEW_RELEASE" | jq -r '.id')

            echo "Syncing assets for $TAG..."
            ASSETS_JSON=$(curl -s "https://api.github.com/repos/$UPSTREAM/releases/$RID/assets")
            ASSET_IDS=$(echo "$ASSETS_JSON" | jq -r '.[].id')

            for AID in $ASSET_IDS; do
              ANAME=$(echo "$ASSETS_JSON" | jq -r ".[] | select(.id == $AID) | .name")
              URL=$(echo "$ASSETS_JSON" | jq -r ".[] | select(.id == $AID) | .url")
              echo "  Downloading $ANAME..."
              curl -sL -H "Accept: application/octet-stream" "$URL" -o "/tmp/$ANAME"
              echo "  Uploading $ANAME to fork release..."
              gh api "repos/$FORK/releases/$NEW_ID/assets" \
                -F name="$ANAME" \
                -F data=@/tmp/$ANAME \
                --jq '.name' || echo "  Failed to upload $ANAME"
              rm -f "/tmp/$ANAME"
            done
            echo "Release $TAG synced."
          done
          echo "Done."
